services:
  mongo:
    image: mongo:8
    container_name: dogfood-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - dogfood-mongo-data:/data/db

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  seed:
    build: ./backend
    container_name: dogfood-seed
    restart: "no"

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/dogfood
      JWT_ACCESS_SECRET: dogfood-local-access-secret-change-me
      JWT_REFRESH_SECRET: dogfood-local-refresh-secret-change-me
      NODE_ENV: development

    depends_on:
      mongo:
        condition: service_healthy

    command: ["npm", "run", "seed"]

  backend:
    build: ./backend
    container_name: dogfood-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/dogfood
      JWT_ACCESS_SECRET: dogfood-local-access-secret-change-me
      JWT_REFRESH_SECRET: dogfood-local-refresh-secret-change-me
      NODE_ENV: development

    depends_on:
      seed:
        condition: service_completed_successfully

    command: ["npm", "start"]

    ports:
      - "5000:5000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: dogfood-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"
      - "5173:80"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dogfood-mongo-data:
